# One stage of the factory on one issue or pull request, for a repository's own workflow to call
# (README › Factory in GitHub Actions). The caller decides which events start a stage; this file decides what a
# run may do: it acts as a GitHub App that can open a pull request and nothing more, with the factory profile.
name: Factory

on:
  workflow_call:
    inputs:
      stage:
        description: issue, review, respond, update, comment or qa
        type: string
        required: true
      number:
        description: The issue (stage issue) or the pull request (the other stages); either one for stage comment
        type: number
        required: true
      comment:
        description: Stage comment only, the id of the comment that starts with /factory
        type: string
        default: ""
      app-client-id:
        description: Client ID of the GitHub App the run acts as
        type: string
        required: true
      kit-repository:
        description: This config repository, as owner/name
        type: string
        required: true
      kit-ref:
        description: The branch, tag or commit of the config to install
        type: string
        default: main
      stacks:
        description: The stacks whose skills the run gets, as install.sh --stacks takes them
        type: string
        default: none
      model:
        type: string
        default: sonnet
      budget-usd:
        description: The most one run may spend
        type: string
        default: "2"
      board:
        description: Number of the owner's project whose Status follows the issue; 0 for none
        type: number
        default: 0
      claude-code-version:
        type: string
        default: "2.1.330"
      node-version:
        type: string
        default: "22"
      keep-transcript:
        description: Keep the run's transcript as an artifact for a week. It quotes the repository's files.
        type: boolean
        default: false
    secrets:
      app-private-key:
        required: true
      anthropic-api-key:
        required: false
      claude-code-oauth-token:
        required: false

permissions:
  contents: read

jobs:
  # Who may start a run: the app itself (its pull request was opened, its review was posted) or a person who can
  # push to the repository. A caller's `if:` cannot tell: the association GitHub puts in the event calls a
  # member whose membership is private a contributor. For anyone else the run is skipped.
  gate:
    name: Who started it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.who.outputs.allowed }}
    steps:
      - name: Token to ask with
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-metadata: read

      - name: Ask the repository
        id: who
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          KIT_REPOSITORY: ${{ inputs.kit-repository }}
          KIT_REF: ${{ inputs.kit-ref }}
        run: |
          git init -q "$RUNNER_TEMP/kit"
          git -C "$RUNNER_TEMP/kit" fetch -q --depth 1 "$GITHUB_SERVER_URL/$KIT_REPOSITORY" "$KIT_REF"
          git -C "$RUNNER_TEMP/kit" checkout -q FETCH_HEAD
          allowed=$("$RUNNER_TEMP/kit/plugins/factory/may-start.sh" "$ACTOR" "$SLUG")
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [ "$allowed" != true ]; then echo "::notice::$ACTOR cannot push to $GH_REPO: no run."; fi

  run:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    name: ${{ inputs.stage }} ${{ inputs.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: factory-${{ github.repository }}-${{ inputs.stage }}-${{ inputs.number }}
      cancel-in-progress: false
    env:
      STAGE: ${{ inputs.stage }}
      NUMBER: ${{ inputs.number }}
      COMMENT: ${{ inputs.comment }}
      OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the call
        run: |
          case "$STAGE" in
            issue|review|respond|update|comment|qa) ;;
            *) echo "::error::There is no stage \"$STAGE\": issue, review, respond, update, comment or qa."; exit 64 ;;
          esac
          if [ "$STAGE" = comment ] && ! [[ "$COMMENT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Stage comment needs the id of the comment (input comment)."; exit 64
          fi

      # The run's only identity on GitHub. A review gets a token that cannot push; no stage gets one that can
      # change a workflow, so a pull request can never rewrite the workflow that will run on it.
      - name: Token for the run
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ (inputs.stage == 'review' || inputs.stage == 'qa') && 'read' || 'write' }}
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-statuses: read
          permission-actions: read

      - name: Find the pull request's branch
        id: pr
        if: inputs.stage != 'issue'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # A comment may be on an issue: then there is no branch to find, and the default branch is checked out.
          if [ "$STAGE" = comment ] && ! gh pr view "$NUMBER" --json number > /dev/null 2>&1; then exit 0; fi
          pr=$(gh pr view "$NUMBER" --json headRefName,isCrossRepository,state)
          if [ "$(jq -r '.isCrossRepository' <<< "$pr")" != false ]; then
            echo "::error::A pull request from a fork never starts a run."; exit 1
          fi
          if [ "$(jq -r '.state' <<< "$pr")" != OPEN ]; then
            echo "::error::Pull request $NUMBER is not open."; exit 1
          fi
          echo "head=$(jq -r '.headRefName' <<< "$pr")" >> "$GITHUB_OUTPUT"

      # An issue starts from the default branch; a pull request stage from that pull request's branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0

      # The sandbox (see below) leaves empty stand-ins in the checkout for the files it protects. Git must not
      # see them: `git add -A` would fail on them or commit them. Only a name the repository does not have is
      # hidden, and only at its root: where the repository has a `.vscode` of its own, new files in it still show.
      - name: Keep the sandbox's stand-ins out of git
        run: |
          for name in '.bash_profile' '.bashrc' '.profile' '.zprofile' '.zshrc' '.gitconfig' '.ripgreprc' \
            '.mcp.json' '.idea' '.vscode'; do
            if [ ! -e "$name" ]; then echo "/$name" >> .git/info/exclude; fi
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      # The runner is thrown away after the job, so the profile goes into its own ~/.claude: the hooks find the
      # folder there without CLAUDE_CONFIG_DIR, which the secret scrub below removes from what they see.
      - name: Install Claude Code and the factory profile
        env:
          KIT_REPOSITORY: ${{ inputs.kit-repository }}
          KIT_REF: ${{ inputs.kit-ref }}
          STACKS: ${{ inputs.stacks }}
          CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        run: |
          git init -q "$RUNNER_TEMP/kit"
          git -C "$RUNNER_TEMP/kit" fetch -q --depth 1 "$GITHUB_SERVER_URL/$KIT_REPOSITORY" "$KIT_REF"
          git -C "$RUNNER_TEMP/kit" checkout -q FETCH_HEAD
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kit/install.sh" --profile factory --config-dir "$HOME/.claude" --stacks "$STACKS"

      # On Linux the secret scrub below runs each of the model's commands in a sandbox, which needs these two
      # programs and, on Ubuntu, a profile that lets bubblewrap create its user namespace. Without them no
      # command starts at all.
      - name: Install what the sandbox needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' '' \
            'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  include if exists <local/bwrap>' '}' \
            | sudo tee /etc/apparmor.d/bwrap > /dev/null
          sudo systemctl reload apparmor

      - name: Commit as the app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/$SLUG[bot]" --jq '.id')
          git config user.name "$SLUG[bot]"
          git config user.email "$id+$SLUG[bot]@users.noreply.github.com"

      # The board is the workflow's to move, with a token of its own: the run's token cannot touch a project.
      - name: Token for the board
        id: board
        if: inputs.board > 0 && contains(fromJSON('["issue", "respond", "qa"]'), inputs.stage)
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      - name: Board, when the run starts
        if: steps.board.outputs.token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.board.outputs.token }}
          BOARD: ${{ inputs.board }}
        run: |
          "$RUNNER_TEMP/kit/plugins/factory/move-cards.sh" "$OWNER" "$BOARD" "$STAGE" "$NUMBER" start

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB keeps the Claude credential out of the commands the model runs; the
      # GitHub token stays, since `gh` and `git push` need it, which is why that token is the narrow one above.
      - name: Run the stage
        id: stage
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude-code-oauth-token }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          DISABLE_AUTOUPDATER: "1"
          FACTORY_MODEL: ${{ inputs.model }}
          FACTORY_BUDGET_USD: ${{ inputs.budget-usd }}
          FACTORY_OUT: ${{ runner.temp }}/factory
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then unset ANTHROPIC_API_KEY; fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; fi
          if [ -z "${ANTHROPIC_API_KEY:-}${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::No Claude credential: pass the secret anthropic-api-key or claude-code-oauth-token."
            exit 1
          fi
          "$RUNNER_TEMP/kit/plugins/factory/run.sh" "$STAGE" "$NUMBER" ${COMMENT:+"$COMMENT"}

      - name: Board, when the run ends
        if: always() && steps.board.outputs.token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.board.outputs.token }}
          BOARD: ${{ inputs.board }}
          OUTCOME: ${{ steps.stage.outcome }}
          FACTORY_OUT: ${{ runner.temp }}/factory
        run: |
          "$RUNNER_TEMP/kit/plugins/factory/move-cards.sh" "$OWNER" "$BOARD" "$STAGE" "$NUMBER" "$OUTCOME"

      # For whoever reads the job: what is in the checkout that no commit holds, the hidden stand-ins included.
      - name: What the run left in the checkout
        if: always()
        run: |
          git status --short --ignored | head -40
          git status --short --ignored | cut -c4- | head -40 | xargs -r -d '\n' stat -c '%F  %s bytes  %n' || true

      - name: Keep the transcript
        if: always() && inputs.keep-transcript
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-${{ inputs.stage }}-${{ inputs.number }}
          path: ${{ runner.temp }}/factory
          retention-days: 7
          if-no-files-found: ignore
