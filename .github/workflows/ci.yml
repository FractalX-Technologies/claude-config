# Test-only CI: nothing here deploys, so it doesn't come from the shared pipeline template.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Syntax-check the scripts
        run: for f in install.sh scripts/*.sh hooks/*.sh hooks/lib/*.sh; do bash -n "$f"; done
      - name: Hooks and installer tests
        run: node --test hooks/test/*.test.mjs test/*.test.mjs
